<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Faithful UI mockup derived from src/app/first-steps/login/login.component.html -->
  <rect width="1280" height="800" fill="#131920"/>
  <!-- decorative side panel -->
  <rect width="520" height="800" fill="#1d2630"/>
  <text x="64" y="120" fill="#ffffff" font-size="34" font-weight="700">Finance Manager</text>
  <text x="64" y="158" fill="#8996a4" font-size="17">Controle de receitas, despesas, faturas e pagamentos.</text>
  <g fill="#3e4853">
    <rect x="64" y="300" width="392" height="1" />
  </g>
  <text x="64" y="270" fill="#6293ff" font-size="15" font-weight="600" letter-spacing="2">ENTRE NA SUA CONTA</text>
  <text x="64" y="360" fill="#8996a4" font-size="15">Autenticação JWT • Angular 16 • Bootstrap 5</text>

  <!-- login card -->
  <g>
    <rect x="640" y="120" width="448" height="560" rx="14" fill="#1d2630" stroke="rgba(248,249,250,0.05)"/>
    <!-- logo -->
    <text x="864" y="186" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">Logo</text>

    <!-- social buttons -->
    <g>
      <rect x="680" y="214" width="368" height="42" rx="8" fill="#131920" stroke="#3e4853"/>
      <circle cx="708" cy="235" r="9" fill="#1877f2"/>
      <text x="760" y="240" fill="#f8f9fa" font-size="14">Sign In with Facebook</text>

      <rect x="680" y="266" width="368" height="42" rx="8" fill="#131920" stroke="#3e4853"/>
      <circle cx="708" cy="287" r="9" fill="#ea4335"/>
      <text x="760" y="292" fill="#f8f9fa" font-size="14">Sign In with Google</text>

      <rect x="680" y="318" width="368" height="42" rx="8" fill="#131920" stroke="#3e4853"/>
      <circle cx="708" cy="339" r="9" fill="#1da1f2"/>
      <text x="760" y="344" fill="#f8f9fa" font-size="14">Sign In with Twitter</text>
    </g>

    <!-- OR divider -->
    <line x1="680" y1="392" x2="838" y2="392" stroke="#3e4853"/>
    <text x="864" y="397" fill="#8996a4" font-size="13" text-anchor="middle">OR</text>
    <line x1="890" y1="392" x2="1048" y2="392" stroke="#3e4853"/>

    <!-- title -->
    <text x="680" y="436" fill="#ffffff" font-size="22" font-weight="700">Login</text>
    <text x="1048" y="436" fill="#6293ff" font-size="13" text-anchor="end">Don't have an account?</text>

    <!-- email -->
    <text x="680" y="470" fill="#8996a4" font-size="13">Email</text>
    <rect x="680" y="480" width="368" height="46" rx="8" fill="#131920" stroke="#6293ff"/>
    <text x="698" y="508" fill="#8996a4" font-size="14">Email ou usuário</text>

    <!-- password -->
    <text x="680" y="552" fill="#8996a4" font-size="13">Senha</text>
    <rect x="680" y="562" width="368" height="46" rx="8" fill="#131920" stroke="#3e4853"/>
    <text x="698" y="590" fill="#8996a4" font-size="14">••••••••</text>

    <!-- submit -->
    <rect x="680" y="628" width="368" height="46" rx="8" fill="#0286c8"/>
    <text x="864" y="657" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Entrar</text>
  </g>
</svg>
